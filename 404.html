<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opening Validoc</title>
  <script>
    const parts=location.pathname.split("/").filter(Boolean);
    const base=location.hostname.endsWith("github.io")&&parts.length?`/${parts[0]}/`:"/";
    location.replace(`${location.origin}${base}${location.search}${location.hash}`);
  </script>
</head>
<body>Opening Validoc…</body>
</html>
